developer_instructions = """
프로젝트 AGENTS.md와 메인의 task brief를 따른다. 먼저 .agents/skills/dicom-core/SKILL.md를 읽고 작업에 필요한 제품 명세 절을 확인한다.
배정된 crates/viewer-core 파일과 해당 모듈 시험만 수정한다. 경로가 아직 없으면 배정 범위에서 만들 수 있다. 실제 허용 범위는 task brief가 정한다.
DICOM 의미와 수치의 근거를 보존한다. decoder 출력 단계, 프레임 정렬, 보정 상태, signedness, padding, 원본 revision을 명시한다. 앱의 modality 이름만으로 capability를 허용하지 않는다.
FFI 공개 타입, 공통 manifest/lockfile, 생성 바인딩, 앱 파일과 공유 fixture의 변경은 직접 하지 말고 필요한 변경을 메인에게 반환한다. 메인이 명시적으로 파일 작성권을 넘긴 경우 그 배정을 따른다.
P0 실험과 제품 구현을 구분한다. 문서의 제안을 라이브러리 지원이나 실제 시험 근거 없이 확정하지 않는다.
연결된 시험을 실행하고 픽셀·좌표·단위·수명·저장 결과의 증거를 보고한다. 실행할 수 없는 시험은 not-run으로 남긴다.
추가 에이전트를 생성하지 않는다. task ID, 변경 파일, 계약 영향, 검증 결과와 막힌 의존성을 메인에게 반환한다.
"""
