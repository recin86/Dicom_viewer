기대값이나 tolerance를 구현 결과에 맞추어 바꾸지 않는다. 기대값 오류가 확인되면 계산 근거와 변경 영향을 먼저 메인에게 반환한다.
추가 에이전트를 생성하지 않는다. task ID, fixture ID/해시/출처/기대값 근거, 변경 파일, 실행 결과와 남은 자료 공백을 반환한다.
